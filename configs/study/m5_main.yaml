# Milestone 5: the main study, on the full dataset and a GPU.
#
# Sized for ~41 GPU-hours on an RTX 4060 (E011, E012): every run trains 5,000 steps of batch 64.
# Run it in three stages; each one ends with results that stand on their own. Every command can
# be stopped (Ctrl+C, shut down) and run again: finished work is skipped and an interrupted run
# continues from its last finished epoch.
#
#   Stage 1, ~12 h: every model x regime, seed 0, plus baselines -> the complete main table
#     python -m nfds.study.run configs/study/m5_main.yaml --only "*-nall-s0"
#   Stage 2, ~24 h: seeds 1 and 2 -> error bars and confidence intervals
#     python -m nfds.study.run configs/study/m5_main.yaml --only "*-nall-s[12]"
#   Stage 3, ~5 h: data scaling, few-shot adaptation, the accuracy-vs-cost benchmark
#     python -m nfds.study.run configs/study/m5_main.yaml
#
#   python -m nfds.study.run configs/study/m5_main.yaml --list   # plan + progress
#   python -m nfds.study.aggregate configs/study/m5_main.yaml    # tables, figures, report

name: m5_main
data: data/forced_v1
runs_dir: runs/m5_main
results_dir: results/m5_main

models:                       # base training configs (architecture, optimiser, epochs)
  cnn: configs/train/cnn_v1.yaml
  unet: configs/train/unet_v1.yaml
  fno: configs/train/fno_v1.yaml
  hybrid: configs/train/hybrid_v1.yaml

overrides: []                 # applied to every run, e.g. ["optim.epochs=30"]
model_overrides: {}

experiments:
  regimes:                    # core ablation: how to train for stable rollouts
    models: [cnn, unet, fno]
    regimes:
      onestep: {type: onestep}
      noise: {type: noise, noise_std: 0.05}
      unroll4: {type: unroll, unroll: 4}
      pushforward4: {type: pushforward, unroll: 4}
    seeds: [0, 1, 2]
  hybrid:                     # solver-in-the-loop: does physics + a correction beat both?
    models: [hybrid]
    regimes:
      onestep: {type: onestep}
      unroll4: {type: unroll, unroll: 4}
    seeds: [0, 1, 2]
  scaling:                    # test error vs number of training trajectories
    models: [unet, fno]
    regimes: {onestep: {type: onestep}}
    train_trajectories: [50, 100, 250, 500, 1000]
    seeds: [0]
    evaluate: [test_id]
  fewshot:                    # adapt to unseen high Re with a handful of trajectories
    from: {experiment: regimes, regime: pushforward4, seed: 0}
    models: [unet, fno]
    split: test_re_high
    split_trajectories: 64
    shots: [4, 16]
    val_trajectories: 8
    # natural epochs over the few shots (not 500 cycled steps, which would just memorise them)
    overrides: ["optim.epochs=20", "optim.lr=1.0e-4", "optim.warmup_epochs=0.5",
                "optim.steps_per_epoch=null"]

evaluation:
  horizon: 40                 # 10 time units
  splits: [test_id, test_interp, test_re_low, test_re_high, test_ic]
  resolution_transfer: {split: test_id, resolutions: [128, 256]}
  long: {split: test_long, horizon: 396}
  baselines: [persistence, coarse_solver]

speed:                        # accuracy-vs-cost Pareto front
  split: test_id
  runs: "*-nall-s0"
  solver_resolutions: [32, 48, 64, 96, 128, 256]
  horizon: 10
  batch: 16
  compile: false
