# Viscosity-conditioned U-Net on the full GPU dataset.
#   python -m nfds.training.train configs/train/unet_v1.yaml
name: unet_v1
data: data/forced_v1
model: {name: unet, widths: [64, 128, 256], blocks_per_level: 2, emb_dim: 128}
n_in: 1
regime: {type: onestep}
optim: {lr: 3.0e-4, weight_decay: 1.0e-4, epochs: 10, steps_per_epoch: 500, batch_size: 64,
        warmup_epochs: 0.5}   # 5,000 steps: sized for an RTX 4060 (E012)
val: {horizon: 40}
amp: true
num_workers: 0   # data is already in memory; workers would only copy it (slow on Windows)
seed: 0
