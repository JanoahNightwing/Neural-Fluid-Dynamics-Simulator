# Hybrid solver-in-the-loop on the full dataset: the 64² solver plus a learned CNN correction.
# Physics and normalisation are filled in from the dataset by the training loop.
#   python -m nfds.training.train configs/train/hybrid_v1.yaml
name: hybrid_v1
data: data/forced_v1
model:
  name: hybrid
  corrector: cnn
  corrector_kwargs: {width: 64, depth: 8}
  solver_substeps: 25        # dt = 0.01 at 64²: CFL ~0.5 for forced_v1 velocities (E004)
n_in: 1
regime: {type: onestep}
optim: {lr: 1.0e-3, weight_decay: 1.0e-4, epochs: 10, steps_per_epoch: 500, batch_size: 64,
        warmup_epochs: 0.5}   # 5,000 steps: sized for an RTX 4060 (E012)
val: {horizon: 40}
amp: true                    # the solver itself always runs in float32
num_workers: 0
seed: 0
