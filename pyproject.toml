[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfds"
version = "0.3.0"
description = "Neural Fluid Dynamics Simulator: verified 2D Navier-Stokes solvers and neural surrogates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
torch = ["torch>=2.2"]
data = ["torch>=2.2", "h5py>=3.8", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["slow: longer-running verification tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# The datasheet template contains Markdown table rows that cannot be wrapped.
"src/nfds/data/generate.py" = ["E501"]
